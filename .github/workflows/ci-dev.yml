name: CI Dev Code

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - "dev"
      - "bugfix/*"

jobs:
  tests:
    name: Test Dev Code
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Micromamba ${{ matrix.python-version }}
        uses: mamba-org/setup-micromamba@v1
        with:
          environment-name: dev-env
          create-args: >-
            python=${{ matrix.python-version }}
            pip
            suitesparse
            -c conda-forge
          init-shell: >-
            bash
            powershell

      - name: Install dependencies and package
        run: |
          pip install --upgrade pip
          pip install -v -e .[dev]
        shell: bash -el {0}  # ensure login shell so mamba is activated

      - name: Display installed packages
        run: |
          python -m pip list
        shell: bash -el {0}

      - name: Run lint
        run: ruff check
        shell: bash -el {0}

      - name: Test with pytest
        run: pytest -v -s
        shell: bash -el {0}

      - name: Build Docs
        run: |
          cd doc
          make SPHINXOPTS=-nW html
        shell: bash -el {0}

      - name: Upload docs as artifact
        uses: actions/upload-artifact@v4
        with:
          name: scikit-sparse-doc-${{ matrix.os }}-${{ matrix.python-version }}
          path: doc/_build/html
