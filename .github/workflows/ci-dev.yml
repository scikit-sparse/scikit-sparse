name: CI Dev Code

on:
  workflow_dispatch:
  pull_request:

jobs:
  tests:
    name: Test Dev Code
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: 1
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install non-python dependencies on mac
        if: runner.os == 'macOS'
        run: |
          brew install suite-sparse

      - name: Install non-python dependencies on linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install libsuitesparse-dev

      - name: Install dependencies and package
        run: |
          pip install --upgrade pip
          pip install -e .[dev]

      - name: Display installed packages
        run: |
          python -m pip list

      # TODO: update existing code to pass linting checks
      # - name: Run lint
      #   run:  ruff check

      - name: Test with pytest
        run: pytest

      - name: Build Docs
        # TODO update existing docs so "make SPHINXOPTS=-nW html" passes
        run: |
          cd doc
          make html

      - name: Upload docs as artifact
        uses: actions/upload-artifact@v4
        with:
          name: scikit-sparse-doc-${{ matrix.os }}-${{ matrix.python-version }}
          path: doc/_build/html
